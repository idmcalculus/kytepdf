name: "🚀 Feature Request"
description: "Suggest an idea or enhancement for KytePDF"
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for wanting to make KytePDF even better! Please describe your suggestion below.
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem or limitation is."
      placeholder: "I'm always frustrated when I cannot..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen and how it should work."
      placeholder: "I would like to have an option to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "A clear and concise description of any alternative solutions, tools, or workarounds you've considered."
      placeholder: "Using a third-party offline compressor first, but..."
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Add any other context, designs, UI mockups, or screenshots about the feature request here."
