name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Force actions/checkout, actions/cache, and actions/upload-artifact to run
# on Node 24 now instead of Node 20, ahead of the June 2026 forced migration.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  app:
    name: App quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-app-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-app-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests with coverage gate
        run: bun run test:coverage -- --reporter=verbose --reporter=github-actions

      - name: Verify coverage report is non-empty
        run: bun run test:coverage:assert

      - name: Build
        run: bun run build

      - name: Check system Chrome
        run: google-chrome --version

      - name: End-to-end tests
        run: bun run test:e2e -- --project=ci-chrome

      - name: Upload end-to-end report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: coverage/

  oci-auth-parity:
    name: OCI auth parity check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infrastructure/oci-auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: infrastructure/oci-auth/package-lock.json

      - run: npm ci

      - run: npm test
